[project]
name = "solomon"
version = "0.1.0"
description = "LAN-first household dashboard — grocery vertical slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solomon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
